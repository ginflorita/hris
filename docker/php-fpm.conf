; Container-adapted PHP-FPM pool -- see deploy/php-fpm/hris.conf for the
; bare-VPS equivalent. Differs from it only in ways containerizing
; requires: listens on a TCP port (127.0.0.1:9000, matching
; docker/nginx.conf's fastcgi_pass) instead of a host-level Unix socket,
; and runs as www-data (the base php:8.3-fpm image's own user) rather
; than a dedicated `hris` system user -- a single-purpose container has
; no other site to isolate from, so the least-privilege goal blueprint
; §51 17.21 names is already met by the container boundary itself.
; display_errors/expose_php off and the upload-size ceiling are
; unchanged from the bare-VPS version.

[hris]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

php_admin_value[display_errors] = off
php_admin_value[expose_php] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr

php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 12M
