# Container-adapted Nginx server block -- see deploy/nginx/hris.conf for
# the bare-VPS equivalent this mirrors. Differs from it in exactly the
# ways containerizing requires:
#   - No TLS termination or HTTP->HTTPS redirect here -- a container
#     platform (Fly.io, Render, an ALB, etc.) terminates TLS in front of
#     the container and forwards plain HTTP; terminating twice would be
#     redundant, not safer.
#   - fastcgi_pass targets 127.0.0.1:9000 (this container's own PHP-FPM,
#     started alongside Nginx by docker/supervisord.conf) instead of a
#     host-level Unix socket.
#   - Listens on 8080, not 80/443 -- several platforms (Render, Cloud
#     Run) expect a non-privileged listen port so the process needn't
#     run as root.
# Everything else -- denying dotfiles and storage/app/private, blocking
# direct .php execution outside the front controller, the upload size
# cap -- is identical in intent to the bare-VPS config; keep both in
# sync if either changes.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/hris/public;
    index index.php;
    charset utf-8;

    location ~ /\. {
        deny all;
    }

    location ^~ /storage/app/private/ {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        internal;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 12M; # matches EmployeeDocumentController's 10240KB validation rule, plus headroom
}
