; Runs Nginx and PHP-FPM together as this image's "web" role -- see
; docker/entrypoint.sh for how the worker/scheduler roles instead run a
; single foreground command with no supervisor involved. Logs go to
; stdout/stderr (nodaemon + the two program blocks' own redirection)
; rather than files, so a platform's own log collector captures them --
; no docker/log rotation config to maintain inside the image.

[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=php-fpm -F -y /usr/local/etc/php-fpm.d/hris.conf
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
