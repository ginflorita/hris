; Supervisor program definition for the Laravel queue worker --
; blueprint §54 Phase 18 "Queue workers", the deployment-infrastructure
; half of Phase 18b's ShouldQueue notifications (SecurityAlert,
; PayslipPublished, TrainingCertificateExpiring): without an
; always-running `queue:work` process, queued notifications would sit
; in the `jobs` table indefinitely. Drop into
; /etc/supervisor/conf.d/hris-worker.conf. Not validated with
; `supervisorctl` -- no Supervisor binary in the environment this was
; written in; validate on the actual target server before use.

[program:hris-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/hris/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/hris
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=hris
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/hris/worker.log
stopwaitsecs=3600
