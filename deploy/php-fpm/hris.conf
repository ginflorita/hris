; PHP-FPM pool for HRIS -- blueprint §54 Phase 18 "Nginx/PHP-FPM".
; Drop into /etc/php/8.3/fpm/pool.d/hris.conf (adjust the PHP version
; path to match the deployed target -- CLAUDE.md's Stack section
; requires PHP 8.3+). Not validated with `php-fpm -t` -- no php-fpm
; binary in the environment this was written in; validate on the
; actual target server before use.

[hris]
; Blueprint §51 17.21 "Database user least privilege" applies equally
; here: a dedicated, unprivileged system user for this pool, never
; www-data shared with other sites and never root.
user = hris
group = hris

listen = /run/php/hris-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Matches the Nginx server block's fastcgi_pass socket path
; (deploy/nginx/hris.conf) -- keep both in sync if either changes.

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Blueprint §51 17.18: never expose PHP errors in a production
; response body -- this is the infrastructure-level enforcement of the
; same rule CLAUDE.md's Security Hardening section already covers at
; the application config level (APP_DEBUG=false).
php_admin_value[display_errors] = off
php_admin_value[expose_php] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-fpm/hris-error.log

; Matches EmployeeDocumentController's 10240KB upload validation rule
; plus headroom -- keep in sync with the Nginx client_max_body_size
; directive and the application's own `max:10240` validation rules
; (EmployeeDocumentController, ApplicantController) if any of the three
; ever changes.
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 12M

php_admin_value[open_basedir] = /var/www/hris:/tmp
