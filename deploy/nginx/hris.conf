# Nginx server block for HRIS -- blueprint §54 Phase 18 "Nginx/PHP-FPM".
#
# Not validated with `nginx -t` -- no Nginx binary in the environment
# this was written in. Validate on the actual target server before use;
# this follows Laravel's own documented Nginx pattern closely rather
# than inventing one, so it should need only host-specific values
# (server_name, TLS certificate paths, the PHP-FPM socket path from
# deploy/php-fpm/hris.conf) filled in.
#
# Application-level security headers (CSP, X-Frame-Options, etc.) are
# NOT duplicated here -- App\Http\Middleware\SecurityHeaders (Phase
# 17a) already sets them on every response, and setting the same
# header twice at two layers risks them silently disagreeing later.

server {
    listen 80;
    listen [::]:80;
    server_name hris.example.com;

    # HTTP -> HTTPS redirect (blueprint §51 17.13). Leave the ACME
    # HTTP-01 challenge path reachable if using Let's Encrypt/Certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/hris/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hris.example.com;

    root /var/www/hris/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/hris.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hris.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Blueprint §51 17.14: HSTS. App\Http\Middleware\SecurityHeaders
    # also sets this per-request when $request->secure() is true: the
    # duplicate here covers static-file responses Nginx serves directly
    # without ever reaching PHP (Vite build assets, favicon, etc.).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    charset utf-8;

    # Never serve dotfiles (.env, .git, .env.production.example) or the
    # storage/private disk directly -- private employee documents and
    # payslips must only ever be reached through an authenticated
    # Laravel route (Phase 6 EmployeeDocumentController::download(),
    # Phase 12b PayrollItemController), never a raw static file URL.
    location ~ /\. {
        deny all;
    }

    location ^~ /storage/app/private/ {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/hris-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Blueprint §51 17.7/17.18: never let a request execute a PHP
        # file that isn't the front controller (blocks a path-traversal
        # or upload-then-execute attempt from ever reaching PHP-FPM at
        # all, ahead of and independent from the application's own
        # upload validation).
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        internal;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 12M; # matches EmployeeDocumentController's 10240KB validation rule, plus headroom
}
